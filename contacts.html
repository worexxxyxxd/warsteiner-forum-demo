<script>
const P=[59.930873,30.363695],metro=[59.9310,30.3606];
const map=L.map('map',{zoomControl:false,scrollWheelZoom:false,attributionControl:true}).setView([59.9312,30.3570],15);

L.control.zoom({position:'bottomright'}).addTo(map);
L.marker(P,{icon:L.divIcon({className:'',html:'<div class="pin">W</div>',iconSize:[64,64],iconAnchor:[32,32]})}).addTo(map)
 .bindPopup('<b>Варштайнер Форум</b><br>Невский пр., 120').openPopup();

const route=L.polyline([metro,P],{color:'#c9a35a',weight:3,dashArray:'6 8'}).addTo(map);
setTimeout(()=>map.flyTo([59.9310,30.3622],17,{duration:2.5}),900);
