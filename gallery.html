<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Галерея — Варштайнер Форум</title>
<meta name="description" content="Фотографии ресторана Варштайнер Форум: зал, бар, веранда и блюда.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800;900&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=7">
<link rel="stylesheet" href="assets/extras.css?v=7">
</head>
<body class="gal" data-nofoot="1" data-nolenis="1">
<div class="curtain"><b><span>Галерея</span></b></div>
<div class="canvas" id="cv" data-cursor="Тяни"><div class="plane" id="plane"></div></div>
<div class="gal-ui"><h1>Галерея</h1><div><div class="hint mono">Перетаскивайте во все стороны<br>Клик — открыть фото</div><div class="acts"><button class="quiz-btn" id="rnd">🎲 Случайное фото</button></div></div></div>
<div class="lightbox" id="lb"><button class="x mono">Закрыть ✕</button><button class="lb-nav lb-prev" id="lbPrev" aria-label="Предыдущее фото">←</button><img alt=""><button class="lb-nav lb-next" id="lbNext" aria-label="Следующее фото">→</button><span class="lb-count mono" id="lbCount"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="assets/app.js?v=7"></script>
<script src="assets/extras.js?v=7"></script>
<script>
const IM=["hero","bar","veranda","feast","aperol","mural","evening","steak","friends","sign","bartender","posters","ribs","veranda2","lemonade","hall","statues","platter","facade","flowers","margarita","checker","veranda3","glasses"];
const plane=document.getElementById('plane'),cv=document.getElementById('cv');
const COLS=6,ROWS=4;let colW,rowH,BW,BH,tiles=[];
function build(){
  plane.innerHTML='';tiles=[];const mob=innerWidth<700;colW=mob?230:360;rowH=mob?300:470;BW=COLS*colW;BH=ROWS*rowH;
  IM.forEach((k,i)=>{const c=i%COLS,r=Math.floor(i/COLS);const w=colW-(mob?24:40)-(i*37%3)*(mob?14:24);const h=(rowH-60)*(0.62+((i*53)%5)/12);
    const el=document.createElement('div');el.className='tile';el.style.width=w+'px';el.style.height=h+'px';el.innerHTML=`<img src="img/${k}.jpg" alt="" loading="lazy">`;el.dataset.k=k;
    plane.appendChild(el);tiles.push({el,bx:c*colW+(colW-w)/2,by:r*rowH+(c%2)*rowH/2+(rowH-h)/2,w,h})});
}
build();addEventListener('resize',build);
let ox=-BW/4,oy=-BH/4,tx=ox,ty=oy,vx=0,vy=0,drag=null,moved=0;
const wrap=(v,min,max)=>{const r=max-min;return((v-min)%r+r)%r+min};
cv.addEventListener('pointerdown',e=>{if(e.button>0)return;drag={x:e.clientX,y:e.clientY,tx,ty};moved=0;cv.classList.add('drag');try{cv.setPointerCapture(e.pointerId)}catch(_){}});
const endG=()=>{drag=null;cv.classList.remove('drag');document.documentElement.classList.remove('dragging')};
cv.addEventListener('pointercancel',endG);cv.addEventListener('lostpointercapture',()=>setTimeout(endG,0));addEventListener('blur',endG);
cv.addEventListener('pointermove',e=>{if(!drag)return;if(e.pointerType==='mouse'&&e.buttons===0){endG();return}const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));tx=drag.tx+dx*1.4;ty=drag.ty+dy*1.4});
cv.addEventListener('pointerup',e=>{cv.classList.remove('drag');if(moved<6){const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');if(t)openLb(t.dataset.k)}endG()});
addEventListener('wheel',e=>{tx-=e.deltaX*1.2;ty-=e.deltaY*1.2},{passive:true});
function loop(){ox+=(tx-ox)*.08;oy+=(ty-oy)*.08;vx=tx-ox;vy=ty-oy;
  const sc=1-Math.min(Math.hypot(vx,vy)/3000,.12);
  tiles.forEach(t=>{const x=wrap(t.bx+ox,-colW,BW-colW),y=wrap(t.by+oy,-rowH,BH-rowH);
    t.el.style.transform=`translate3d(${x}px,${y}px,0) scale(${sc}) skew(${gsap.utils.clamp(-6,6,vx*.01)}deg,${gsap.utils.clamp(-6,6,vy*.01)}deg)`});
  requestAnimationFrame(loop)}
loop();
if(!APP.reduce)gsap.from('.tile',{opacity:0,scale:.4,duration:1.4,stagger:{each:.03,from:'random'},ease:'expo.out',delay:.5});
const lb=document.getElementById('lb');
let lbI=0;
function openLb(k,dir=0){lbI=IM.indexOf(k);lb.querySelector('img').src='img/'+k+'.jpg';lb.classList.add('open');document.getElementById('lbCount').textContent=(lbI+1)+' / '+IM.length;
  gsap.fromTo(lb.querySelector('img'),{scale:dir?1:.85,x:dir*80,opacity:0},{scale:1,x:0,opacity:1,duration:.7,ease:'expo.out'})}
const step=d=>openLb(IM[(lbI+d+IM.length)%IM.length],d);
document.getElementById('lbPrev').onclick=e=>{e.stopPropagation();step(-1)};
document.getElementById('lbNext').onclick=e=>{e.stopPropagation();step(1)};
lb.onclick=()=>lb.classList.remove('open');
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
/* swipe in lightbox on phones */
let sx=null;lb.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
lb.addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)step(d<0?1:-1);sx=null});
/* random photo: the canvas flies, then the photo opens */
document.getElementById('rnd').onclick=()=>{const k=IM[Math.floor(Math.random()*IM.length)];tx+=(Math.random()-.5)*1600;ty+=(Math.random()-.5)*1200;setTimeout(()=>openLb(k),650)};
</script>
</body>
</html>
